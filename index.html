<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習工具整合入口</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f0f2f5; }
        :root { --top-h: 52px; --accent: #1f6feb; }

        /* 頂部工具列 */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: var(--top-h);
            display: flex; align-items: center; gap: 14px;
            padding: 0 14px;
            background: #1a2233; color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.2);
        }
        .brand { font-weight: 600; font-size: 15px; white-space: nowrap; }
        .brand small { display: block; font-weight: 400; font-size: 11px; color: #9fb0c9; }

        .tabs { display: flex; gap: 6px; margin-left: 8px; }
        .tab {
            border: 1px solid rgba(255,255,255,.25);
            background: transparent; color: #d7e0ee;
            padding: 7px 14px; border-radius: 8px;
            font-size: 14px; cursor: pointer;
            transition: all .15s ease; white-space: nowrap;
        }
        .tab:hover { background: rgba(255,255,255,.08); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .status { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .status-text { font-size: 12px; color: #b9c6d8; white-space: nowrap; }
        .status-text.ok { color: #4ade80; }
        .status-text.err { color: #f87171; }
        .act-btn {
            border: 1px solid rgba(255,255,255,.25); background: transparent;
            color: #e2e8f0; padding: 5px 10px; border-radius: 6px;
            font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .act-btn:hover { background: rgba(255,255,255,.1); }
        .act-btn:disabled { opacity: .6; cursor: default; }

        /* 內容區（放 iframe） */
        main { position: fixed; top: var(--top-h); left: 0; right: 0; bottom: 0; }
        .frame-wrap { position: absolute; inset: 0; display: none; }
        .frame-wrap.active { display: block; }
        .frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

        /* 載入中遮罩 */
        .loader {
            position: absolute; inset: 0; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            background: #f0f2f5; color: #64748b; font-size: 14px; gap: 10px; z-index: 5;
        }
        .spinner {
            width: 30px; height: 30px; border-radius: 50%;
            border: 3px solid #cbd5e1; border-top-color: var(--accent);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .brand small { display: none; }
            .status-text { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="brand">學習工具<small>兩個工具整合入口</small></div>
        <nav class="tabs">
            <button id="tabImage" class="tab active">🖼️ 圖片搜尋</button>
            <button id="tabSentence" class="tab">📚 單字卡</button>
        </nav>
        <div class="status">
            <span id="actStatus" class="status-text">啟動中…</span>
            <button id="actNowBtn" class="act-btn" title="立即用輕量封包啟動兩個 Supabase 帳號">保持啟動</button>
        </div>
    </header>

    <main>
        <div class="frame-wrap active" id="wrapImage">
            <div class="loader" id="loaderImage"><div class="spinner"></div><div>載入中…</div></div>
            <iframe id="frameImage" title="圖片搜尋與單詞卡"></iframe>
        </div>
        <div class="frame-wrap" id="wrapSentence">
            <div class="loader" id="loaderSentence"><div class="spinner"></div><div>載入中…</div></div>
            <iframe id="frameSentence" title="單字卡學習"></iframe>
        </div>
    </main>

    <script>
    // ============================================================
    // 這份整合頁面「不改動」底下兩個工具各自的 API 設定。
    // 這裡只記錄了兩組 Supabase 專案資訊，用來在開啟頁面時，
    // 以「極輕量封包」各自打一次資料庫查詢，讓免費版帳號一週內保持活躍、不被暫停。
    // ============================================================
    var APPS = [
        {
            id: 'Image',
            tabId: 'tabImage',
            wrapId: 'wrapImage',
            frameId: 'frameImage',
            loaderId: 'loaderImage',
            src: 'Image-Match-Game-main/index.html',
            label: '圖片搜尋',
            // Supabase 專案設定（維持原樣，不更動）
            supabaseUrl: 'https://lnuguottscfwsmthmrkv.supabase.co',
            supabaseKey: 'sb_publishable_kywRcUbkTQza7NwH8N4_Fg_oE0h4tSj',
            pingTable: 'flashcard_explanations'
        },
        {
            id: 'Sentence',
            tabId: 'tabSentence',
            wrapId: 'wrapSentence',
            frameId: 'frameSentence',
            loaderId: 'loaderSentence',
            src: 'SentenceGame-main/index.html',
            label: '單字卡',
            // Supabase 專案設定（維持原樣，不更動）
            supabaseUrl: 'https://fsqjuteaoprcrdsphqpt.supabase.co',
            supabaseKey: 'sb_publishable_DIcf1pkMLybWGtAafbLABw_FZ4GQEs8',
            pingTable: 'user_cards'
        }
    ];

    // 每 6 天才需要啟動一次（配合 Supabase 免費版「7 天沒活動就會暫停」）
    var ACTIVATE_INTERVAL_MS = 6 * 24 * 60 * 60 * 1000;
    var LAST_ACTIVATE_KEY = 'integrated_learn_tools_last_activate';

    function nowMs() { return Date.now(); }

    // 對單一 Supabase 專案送出「極輕量」的讀取封包（選取 1 列、僅 id 欄位 → 回應極小）
    // 這會被算作真實資料庫活動，足以讓免費專案保持活躍、不被暫停。
    async function pingProject(app) {
        var url = app.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/' + app.pingTable +
                  '?select=id&limit=1';
        var res = await fetch(url, {
            method: 'GET',
            headers: {
                'apikey': app.supabaseKey,
                'Authorization': 'Bearer ' + app.supabaseKey,
                'Accept': 'application/json'
            },
            cache: 'no-store'
        });
        if (!res.ok) {
            throw new Error(app.label + ' 啟動失敗 (HTTP ' + res.status + ')');
        }
        // 讀取完畢再結束（即便回應很小）
        await res.text();
    }

    var _activating = false;
    async function activateAll(force) {
        if (_activating) return;
        _activating = true;
        var btn = document.getElementById('actNowBtn');
        var st = document.getElementById('actStatus');
        if (btn) btn.disabled = true;

        try {
            var lastRaw = localStorage.getItem(LAST_ACTIVATE_KEY);
            var last = lastRaw ? parseInt(lastRaw, 10) : 0;
            if (!force && last && (nowMs() - last) < ACTIVATE_INTERVAL_MS) {
                // 6 天內才啟動過，不需要再啟動
                var remain = ACTIVATE_INTERVAL_MS - (nowMs() - last);
                st.textContent = '已保持啟動（約 ' + Math.ceil(remain / (24 * 3600 * 1000)) + ' 天後再自動啟動）';
                st.className = 'status-text ok';
                if (btn) btn.disabled = false;
                return;
            }

            st.textContent = '正在啟動兩個帳號…';
            st.className = 'status-text';

            var results = await Promise.allSettled(APPS.map(function (app) {
                return pingProject(app);
            }));

            var allOk = results.every(function (r) { return r.status === 'fulfilled'; });
            localStorage.setItem(LAST_ACTIVATE_KEY, String(nowMs()));

            if (allOk) {
                st.textContent = '✅ 兩個 Supabase 帳號已啟動，6 天內將保持活躍';
                st.className = 'status-text ok';
            } else {
                var fail = results.map(function (r, i) {
                    return r.status === 'rejected' ? APPS[i].label + '(' + (r.reason && r.reason.message || '未知錯誤') + ')' : null;
                }).filter(Boolean).join('、');
                st.textContent = '⚠️ 部分啟動失敗：' + fail;
                st.className = 'status-text err';
            }
        } catch (e) {
            st.textContent = '⚠️ 啟動程序發生錯誤：' + (e && e.message || e);
            st.className = 'status-text err';
        } finally {
            _activating = false;
            if (btn) btn.disabled = false;
        }
    }
// ------------------------------------------------------------------
    // 頁籤切換（延遲載入 iframe，切換時才載入目標工具，保持輕量）
    // ------------------------------------------------------------------
    var ACTIVE_TAB_KEY = 'integrated_learn_tools_active';

    function loadFrame(app) {
        var iframe = document.getElementById(app.frameId);
        if (!iframe.getAttribute('src')) {
            iframe.setAttribute('src', app.src);
            // iframe 載入完成後隱藏該工具自己的載入遮罩
            iframe.addEventListener('load', function () {
                var loader = document.getElementById(app.loaderId);
                if (loader) loader.style.display = 'none';
            });
        }
    }

    function switchTab(app) {
        APPS.forEach(function (a) {
            document.getElementById(a.wrapId).classList.toggle('active', a.id === app.id);
            document.getElementById(a.tabId).classList.toggle('active', a.id === app.id);
        });
        loadFrame(app);
        try { localStorage.setItem(ACTIVE_TAB_KEY, app.id); } catch (e) {}
    }

    function bindTabs() {
        APPS.forEach(function (app) {
            document.getElementById(app.tabId).addEventListener('click', function () {
                switchTab(app);
            });
        });
        var btn = document.getElementById('actNowBtn');
        if (btn) btn.addEventListener('click', function () { activateAll(true); });
    }

    // ------------------------------------------------------------------
    // 啟動
    // ------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', function () {
        bindTabs();
        // 恢復上次使用的頁籤
        var saved = null;
        try { saved = localStorage.getItem(ACTIVE_TAB_KEY); } catch (e) {}
        var initial = APPS.find(function (a) { return a.id === saved; }) || APPS[0];
        // 預設載入該頁籤，並開始自動啟動兩個帳號
        switchTab(initial);
        activateAll(false);
    });
    </script>
</body>
</html>
